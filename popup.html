<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaPeek</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main aria-busy="true">
    <header>
      <div class="identity"><span class="favicon-slot" aria-hidden="true"><span id="favicon-fallback">·</span><img id="favicon" alt=""></span><p id="site">MetaPeek</p></div>
      <p class="brand">MetaPeek</p>
    </header>
    <section id="preview" aria-label="Open Graph image">
      <a id="image-link" target="_blank" rel="noopener noreferrer" aria-label="Open OG image in a new tab"><img id="image" alt="Open Graph image"></a>
      <p id="status" role="status">Loading…</p>
      <p id="image-caption">og:image</p>
    </section>
    <section id="details" aria-label="Metadata" tabindex="0"><dl id="metadata">
      <div class="row skeleton"><dt>title</dt><dd> </dd></div>
      <div class="row skeleton"><dt>description</dt><dd> </dd></div>
      <div class="row skeleton"><dt>canonical</dt><dd> </dd></div>
    </dl></section>
  </main>
</body>
</html>
